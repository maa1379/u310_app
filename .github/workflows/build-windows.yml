name: Build Windows installer

on:
  push:
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Build installer
        shell: pwsh
        run: |
          $versionLine = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)' } | Select-Object -First 1
          if (-not $versionLine) { throw 'Could not read app version from pubspec.yaml' }
          $version = [regex]::Match($versionLine, '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Groups[1].Value
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler is missing from the runner' }
          & $compiler "/DAppVersion=$version" 'windows\installer.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: U310-Windows-Installer
          path: build/installer/*.exe
          if-no-files-found: error
